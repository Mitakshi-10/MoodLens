name: Run MoodLens

# Save this file in your repo as:  .github/workflows/run.yml
# Then go to the Actions tab -> "Run MoodLens" -> "Run workflow".

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: "Experiment to train (E1, E2, E3, E4)"
        required: true
        default: "E1"
        type: choice
        options: [E1, E2, E3, E4]
      fast:
        description: "Fast smoke test (2 epochs). Untick for a full training run."
        required: true
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - "facial-emotion-recognition/**"
      - "requirements.txt"
      - ".github/workflows/run.yml"

jobs:
  run-moodlens:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # GitHub-hosted runners stop jobs at 6 hours
    defaults:
      run:
        working-directory: facial-emotion-recognition
    env:
      MPLBACKEND: Agg                 # headless matplotlib (no display on the runner)
      TF_CPP_MIN_LOG_LEVEL: "2"
      EXPERIMENT: ${{ github.event.inputs.experiment || 'E1' }}
      FAST: ${{ github.event_name == 'push' && 'true' || github.event.inputs.fast }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: facial-emotion-recognition/requirements.txt

      - name: Install system libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download and prepare FER-2013 dataset
        run: python -m src.data_prep

      - name: Train ${{ env.EXPERIMENT }}
        run: |
          if [ "$FAST" = "true" ]; then
            python -m src.train --experiment "$EXPERIMENT" --fast
          else
            python -m src.train --experiment "$EXPERIMENT"
          fi

      - name: Evaluate ${{ env.EXPERIMENT }} on the test set
        run: python -m src.evaluate --experiment "$EXPERIMENT"

      - name: Generate comparison report
        run: python -m src.report
        continue-on-error: true   # report may need several experiments to be trained

      - name: Show results summary
        run: |
          echo "### MoodLens results (${EXPERIMENT})" >> "$GITHUB_STEP_SUMMARY"
          if [ -f results/comparison_table.md ]; then
            cat results/comparison_table.md >> "$GITHUB_STEP_SUMMARY"
          else
            ls results >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results and trained model
        uses: actions/upload-artifact@v4
        with:
          name: moodlens-${{ env.EXPERIMENT }}-outputs
          path: |
            facial-emotion-recognition/results/
            facial-emotion-recognition/models/*.keras
          if-no-files-found: warn
